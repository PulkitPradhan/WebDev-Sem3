<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Connect & Communication Platform</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      padding: 1rem 2rem;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #0284c7;
      color: #fff;
    }
    main {
      flex: 1;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card h2 {
      font-size: 1.1rem;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.9rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      background: #0284c7;
      border: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    button.secondary {
      background: #334155;
    }
    button.secondary:hover {
      background: #475569;
    }
    button.danger {
      background: #dc2626;
    }
    button.danger:hover {
      background: #b91c1c;
    }
    .response-box {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.8rem;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .chat-messages {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      height: 250px;
      overflow-y: auto;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .chat-msg {
      font-size: 0.85rem;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      background: #1e293b;
    }
    .chat-msg span.user {
      font-weight: 700;
      color: #38bdf8;
    }
    .chat-msg span.system {
      font-style: italic;
      color: #94a3b8;
    }
    .note-item {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: #38bdf8;
    }
    .note-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>i7Lab 4: Secure Connect & Communication Platform</h1>
    <div id="user-status" class="badge">Guest</div>
  </header>

  <main>
    <section class="card">
      <h2>1. Authentication (JWT & bcrypt)</h2>
      <input type="text" id="auth-username" placeholder="Username (e.g. victor)">
      <input type="email" id="auth-email" placeholder="Email (e.g. victor@example.com)">
      <input type="password" id="auth-password" placeholder="Password (e.g. 123456)">
      <select id="auth-role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
      <div style="display:flex; gap:0.5rem;">
        <button onclick="handleSignup()">Sign Up</button>
        <button onclick="handleLogin()" class="secondary">Log In</button>
      </div>
      <div class="response-box" id="auth-response">No request sent yet</div>
    </section>

    <section class="card">
      <h2>2. Secure Notes API (CRUD)</h2>
      <input type="text" id="note-title" placeholder="Note Title (e.g. My First Note)">
      <textarea id="note-content" rows="2" placeholder="Note Content (e.g. This is my first note of web dev -III)"></textarea>
      <div style="display:flex; gap:0.5rem;">
        <button onclick="createNote()">Create Note</button>
        <button onclick="loadNotes()" class="secondary">Fetch Notes</button>
      </div>
      <div id="notes-list" style="max-height: 250px; overflow-y: auto;"></div>
    </section>

    <section class="card">
      <h2>3. Real-Time Chat (Socket.IO)</h2>
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="chat-room" value="general" placeholder="Room Name">
        <button onclick="joinRoom()" style="width: 120px;">Join Room</button>
      </div>
      <div class="chat-messages" id="chat-box"></div>
      <div style="display:flex; gap:0.5rem;">
        <input type="text" id="chat-text" placeholder="Type a message (e.g. Hey team, backend is ready 🚀)" onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" style="width: 100px;">Send</button>
      </div>
    </section>
  </main>

  <script>
    let token = localStorage.getItem("token") || "";
    let currentUser = null;
    let socket = null;
    let currentRoom = "general";

    function updateAuthHeader() {
      const statusEl = document.getElementById("user-status");
      if (token && currentUser) {
        statusEl.textContent = `${currentUser.username} (${currentUser.role || "user"})`;
      } else {
        statusEl.textContent = "Guest";
      }
    }

    async function handleSignup() {
      const username = document.getElementById("auth-username").value.trim();
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value;
      const role = document.getElementById("auth-role").value;

      const res = await fetch("/api/auth/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password, role })
      });
      const data = await res.json();
      document.getElementById("auth-response").textContent = JSON.stringify(data, null, 2);
    }

    async function handleLogin() {
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value;

      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      document.getElementById("auth-response").textContent = JSON.stringify(data, null, 2);

      if (res.ok && data.token) {
        token = data.token;
        localStorage.setItem("token", token);
        await fetchProfile();
        loadNotes();
      }
    }

    async function fetchProfile() {
      if (!token) return;
      try {
        const res = await fetch("/api/auth/me", {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) {
          currentUser = await res.json();
          updateAuthHeader();
          if (currentUser.username && !document.getElementById("auth-username").value) {
            document.getElementById("auth-username").value = currentUser.username;
          }
        }
      } catch (err) {}
    }

    async function createNote() {
      const title = document.getElementById("note-title").value.trim();
      const content = document.getElementById("note-content").value.trim();

      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = `Bearer ${token}`;

      const res = await fetch("/api/notes", {
        method: "POST",
        headers,
        body: JSON.stringify({ title, content })
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById("note-title").value = "";
        document.getElementById("note-content").value = "";
        loadNotes();
      } else {
        alert(data.message || "Failed to create note");
      }
    }

    async function loadNotes() {
      const headers = {};
      if (token) headers["Authorization"] = `Bearer ${token}`;

      const res = await fetch("/api/notes", { headers });
      const data = await res.json();
      const listEl = document.getElementById("notes-list");
      listEl.innerHTML = "";

      if (!res.ok) {
        listEl.innerHTML = `<p style="color:#f87171; font-size:0.85rem;">${data.message || "Unauthorized"}</p>`;
        return;
      }

      if (!Array.isArray(data) || data.length === 0) {
        listEl.innerHTML = `<p style="color:#94a3b8; font-size:0.85rem;">No notes found.</p>`;
        return;
      }

      data.forEach(note => {
        const div = document.createElement("div");
        div.className = "note-item";
        div.innerHTML = `
          <div class="note-header">
            <span>${escapeHtml(note.title)}</span>
            <small style="color:#64748b;">${new Date(note.createdAt).toLocaleTimeString()}</small>
          </div>
          <p style="font-size:0.85rem; color:#cbd5e1;">${escapeHtml(note.content)}</p>
          <div class="note-actions">
            <button class="danger" style="padding:0.25rem 0.5rem; font-size:0.75rem; width:auto;" onclick="deleteNote('${note._id}')">Delete</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    async function deleteNote(id) {
      const headers = {};
      if (token) headers["Authorization"] = `Bearer ${token}`;

      const res = await fetch(`/api/notes/${id}`, {
        method: "DELETE",
        headers
      });
      if (res.ok) {
        loadNotes();
      } else {
        const data = await res.json();
        alert(data.message || "Could not delete");
      }
    }

    function initSocket() {
      socket = io();

      socket.on("connect", () => {
        appendChatMessage("system", `Connected to chat server (${socket.id})`);
        joinRoom();
      });

      socket.on("message", (data) => {
        appendChatMessage(data.username, data.message);
      });

      socket.on("roomNotification", (data) => {
        appendChatMessage("system", data.message);
      });
    }

    function joinRoom() {
      const room = document.getElementById("chat-room").value.trim() || "general";
      currentRoom = room;
      const username = currentUser ? currentUser.username : "Guest";
      if (socket) {
        socket.emit("joinRoom", { room, username });
      }
    }

    function sendMessage() {
      const input = document.getElementById("chat-text");
      const message = input.value.trim();
      if (!message || !socket) return;

      const username = currentUser ? currentUser.username : "Anonymous";
      socket.emit("chatMessage", {
        room: currentRoom,
        username,
        message
      });
      input.value = "";
    }

    function appendChatMessage(sender, text) {
      const box = document.getElementById("chat-box");
      const msg = document.createElement("div");
      msg.className = "chat-msg";
      if (sender === "system") {
        msg.innerHTML = `<span class="system">${escapeHtml(text)}</span>`;
      } else {
        msg.innerHTML = `<span class="user">${escapeHtml(sender)}:</span> ${escapeHtml(text)}`;
      }
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.addEventListener("DOMContentLoaded", () => {
      initSocket();
      if (token) {
        fetchProfile();
        loadNotes();
      }
    });
  </script>
</body>
</html>
