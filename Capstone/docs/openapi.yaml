openapi: 3.0.3
info:
  title: University Campus Management API
  version: 1.1.0
  description: REST API for the Backend Development capstone Project 1.
servers:
  - url: http://localhost:3000
tags:
  - name: Auth
  - name: Users
  - name: Courses
  - name: Sections
  - name: Enrollment
  - name: Attendance
  - name: Announcements
  - name: Reports
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: Service is running }
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                studentId: { type: string }
                department: { type: string }
      responses:
        '201': { description: Student account created; access token returned and refresh cookie set }
        '400': { description: Invalid input }
        '409': { description: Duplicate email or student ID }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Access token returned and refresh cookie set }
        '401': { description: Invalid credentials }
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      responses:
        '200': { description: New access token and rotated refresh cookie }
        '401': { description: Missing, invalid or revoked refresh token }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token
      responses:
        '200': { description: Logged out }
  /api/auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: View own profile
      responses:
        '200': { description: Current user profile }
        '401': { description: Unauthorized }
    patch:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Update own name or department
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                department: { type: string }
      responses:
        '200': { description: Updated profile }
  /api/users:
    get:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: List users (admin)
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: Paginated users }
        '403': { description: Insufficient role }
    post:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Provision a user (admin)
      responses:
        '201': { description: User created }
  /api/users/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Get a user (admin)
      responses:
        '200': { description: User }
        '404': { description: Not found }
    patch:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Update a user (admin)
      responses:
        '200': { description: Updated user }
    delete:
      tags: [Users]
      security: [{ bearerAuth: [] }]
      summary: Delete a user (admin)
      responses:
        '200': { description: Deleted }
  /api/courses:
    get:
      tags: [Courses]
      security: [{ bearerAuth: [] }]
      summary: List courses
      responses: { '200': { description: Course list } }
    post:
      tags: [Courses]
      security: [{ bearerAuth: [] }]
      summary: Create course (admin)
      responses: { '201': { description: Created } }
  /api/courses/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Courses]
      security: [{ bearerAuth: [] }]
      summary: Get course
      responses: { '200': { description: Course }, '404': { description: Not found } }
    patch:
      tags: [Courses]
      security: [{ bearerAuth: [] }]
      summary: Update course (admin)
      responses: { '200': { description: Updated } }
    delete:
      tags: [Courses]
      security: [{ bearerAuth: [] }]
      summary: Delete course (admin)
      responses: { '200': { description: Deleted } }
  /api/sections:
    get:
      tags: [Sections]
      security: [{ bearerAuth: [] }]
      summary: List sections
      responses: { '200': { description: Section list } }
    post:
      tags: [Sections]
      security: [{ bearerAuth: [] }]
      summary: Create section (admin)
      responses: { '201': { description: Created } }
  /api/sections/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Sections]
      security: [{ bearerAuth: [] }]
      summary: Get section
      responses: { '200': { description: Section }, '404': { description: Not found } }
    patch:
      tags: [Sections]
      security: [{ bearerAuth: [] }]
      summary: Update section (admin)
      responses: { '200': { description: Updated } }
    delete:
      tags: [Sections]
      security: [{ bearerAuth: [] }]
      summary: Delete section (admin)
      responses: { '200': { description: Deleted } }
  /api/enrollments:
    get:
      tags: [Enrollment]
      security: [{ bearerAuth: [] }]
      summary: List permitted enrollments
      responses: { '200': { description: Enrollment list } }
    post:
      tags: [Enrollment]
      security: [{ bearerAuth: [] }]
      summary: Enroll self or another student (student/admin)
      responses: { '201': { description: Enrollment created }, '409': { description: Duplicate enrollment or full section } }
  /api/enrollments/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Enrollment]
      security: [{ bearerAuth: [] }]
      summary: Get an enrollment (owner, assigned faculty or admin)
      responses: { '200': { description: Enrollment }, '404': { description: Not found } }
    patch:
      tags: [Enrollment]
      security: [{ bearerAuth: [] }]
      summary: Change enrollment status (admin)
      responses: { '200': { description: Updated }, '409': { description: Section capacity conflict } }
    delete:
      tags: [Enrollment]
      security: [{ bearerAuth: [] }]
      summary: Remove enrollment (admin)
      responses: { '200': { description: Deleted } }
  /api/enrollments/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Enrollment]
      security: [{ bearerAuth: [] }]
      summary: Get an enrollment (owner, assigned faculty or admin)
      responses: { '200': { description: Enrollment }, '404': { description: Not found } }
    patch:
      tags: [Enrollment]
      security: [{ bearerAuth: [] }]
      summary: Change enrollment status (admin)
      responses: { '200': { description: Updated }, '409': { description: Section capacity conflict } }
    delete:
      tags: [Enrollment]
      security: [{ bearerAuth: [] }]
      summary: Remove enrollment (admin)
      responses: { '200': { description: Deleted } }
  /api/attendance:
    get:
      tags: [Attendance]
      security: [{ bearerAuth: [] }]
      summary: List attendance; students only see own records
      responses: { '200': { description: Attendance records } }
    post:
      tags: [Attendance]
      security: [{ bearerAuth: [] }]
      summary: Mark attendance (assigned faculty/admin)
      responses: { '201': { description: Attendance recorded }, '403': { description: Section not assigned }, '409': { description: Existing session conflict } }
  /api/attendance/{id}:
    parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
    get:
      tags: [Attendance]
      security: [{ bearerAuth: [] }]
      summary: Get an attendance record (owner, assigned faculty or admin)
      responses: { '200': { description: Attendance record }, '404': { description: Not found } }
    patch:
      tags: [Attendance]
      security: [{ bearerAuth: [] }]
      summary: Correct attendance with a note (assigned faculty/admin)
      responses: { '200': { description: Corrected }, '403': { description: Section not assigned } }
    delete:
      tags: [Attendance]
      security: [{ bearerAuth: [] }]
      summary: Delete attendance record (admin)
      responses: { '200': { description: Deleted }, '404': { description: Not found } }
  /api/attendance/summary:
    get:
      tags: [Attendance]
      security: [{ bearerAuth: [] }]
      summary: Subject-wise attendance summary
      responses: { '200': { description: Percentages by section/course } }
  /api/reports/low-attendance:
    get:
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      summary: Students below attendance threshold (admin/faculty)
      parameters: [{ in: query, name: threshold, schema: { type: number, minimum: 0, maximum: 100 } }]
      responses: { '200': { description: Low attendance report } }
  /api/reports/enrollments:
    get:
      tags: [Reports]
      security: [{ bearerAuth: [] }]
      summary: Section-wise enrollment counts (admin/faculty)
      responses: { '200': { description: Enrollment report } }
  /api/announcements:
    get:
      tags: [Announcements]
      security: [{ bearerAuth: [] }]
      summary: List announcements visible to the current user
      responses: { '200': { description: Announcements } }
    post:
      tags: [Announcements]
      security: [{ bearerAuth: [] }]
      summary: Publish announcement (admin/faculty)
      responses: { '201': { description: Created and emitted in real time } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
